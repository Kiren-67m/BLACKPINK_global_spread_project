<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLACKPINK Release Performance Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
  <style>
    body { margin: 0; color: #150a0e; background: #fff; font: 1rem system-ui, sans-serif; }
    #loading { margin: 3rem auto; max-width: 36rem; padding: 1rem; }
    #loading a { color: #b54b62; }
  </style>
</head>
<body>
  <div id="dashboard">
    <p id="loading" role="status">Loading the interactive dashboard. You can also open the <a href="../?view=1">English report</a>.</p>
  </div>
  <noscript>Enable JavaScript to open the dashboard.</noscript>
  <script type="module">
    const root = document.getElementById("dashboard");
    try {
      const { mount } = await import("https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js");
      mount({
        entrypoint: "dashboard/app.py",
        archives: [{ url: new URL("dashboard.zip", location.href).href, format: "zip" }],
        requirements: ["numpy", "pandas", "plotly==5.24.1"],
      }, root);
    } catch (error) {
      document.querySelector("#loading").firstChild.textContent = "The dashboard could not load. Open the ";
      console.error(error);
    }
  </script>
</body>
</html>
